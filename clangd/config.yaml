Diagnostics:
  UnusedIncludes: Strict
  ClangTidy:
    Add:
      - bugprone-*
      - cert-*
      - clang-analyzer-*
      - misc-*
      - performance-*
      - portability-*
      - readability-*
    Remove:
      - readability-magic-numbers
      - readability-identifier-length
      - readability-braces-around-statements
      - misc-no-recursion
InlayHints:
  Enabled: true
  ParameterNames: true
  Designators: true
